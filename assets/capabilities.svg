<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="284" viewBox="0 0 1000 284" role="img" aria-label="What Atilio Obadia does"><title>What Atilio Obadia does</title><text x="0.0" y="16.0" font-family="Consolas, SF Mono, Menlo, monospace" font-size="11.5" letter-spacing="1.2" fill="#0f766e">02</text><text x="34.4" y="16.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="600" letter-spacing="2.2" fill="#0b1116">what i do</text><text x="942.4" y="16.0" font-family="Consolas, SF Mono, Menlo, monospace" font-size="10.5" letter-spacing="1.2" fill="#6b7885">services</text><line x1="133.2" y1="12" x2="920.4" y2="12" stroke="#e2e7ec" stroke-width="1"/><rect x="0.0" y="52.0" width="493.0" height="98" rx="12" fill="#f8fafb" stroke="#e6ecf0" stroke-width="1"/><rect x="18.0" y="70.0" width="3" height="13" rx="1.5" fill="#0f766e"/><text x="30.0" y="81.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#0b1116">ERP implementation</text><text x="475.0" y="80.0" font-family="Consolas, SF Mono, Menlo, monospace" font-size="10.5" letter-spacing="1" fill="#6b7885" text-anchor="end">01</text><text x="18.0" y="107.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.6" fill="#3d4a55">Full-cycle ERPNext and Frappe rollouts: chart of accounts, workflows,</text><text x="18.0" y="126.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.6" fill="#3d4a55">custom DocTypes, server and client scripts.</text><rect x="507.0" y="52.0" width="493.0" height="98" rx="12" fill="#f8fafb" stroke="#e6ecf0" stroke-width="1"/><rect x="525.0" y="70.0" width="3" height="13" rx="1.5" fill="#0f766e"/><text x="537.0" y="81.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#0b1116">Custom systems</text><text x="982.0" y="80.0" font-family="Consolas, SF Mono, Menlo, monospace" font-size="10.5" letter-spacing="1" fill="#6b7885" text-anchor="end">02</text><text x="525.0" y="107.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.6" fill="#3d4a55">Purpose-built platforms when off-the-shelf stops fitting: inventory,</text><text x="525.0" y="126.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.6" fill="#3d4a55">portals, booking and operations dashboards.</text><rect x="0.0" y="164.0" width="493.0" height="98" rx="12" fill="#f8fafb" stroke="#e6ecf0" stroke-width="1"/><rect x="18.0" y="182.0" width="3" height="13" rx="1.5" fill="#0f766e"/><text x="30.0" y="193.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#0b1116">Systems integration</text><text x="475.0" y="192.0" font-family="Consolas, SF Mono, Menlo, monospace" font-size="10.5" letter-spacing="1" fill="#6b7885" text-anchor="end">03</text><text x="18.0" y="219.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.6" fill="#3d4a55">REST APIs, payment and messaging gateways, and AI and MCP tooling</text><text x="18.0" y="238.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.6" fill="#3d4a55">that sits inside ERP workflows.</text><rect x="507.0" y="164.0" width="493.0" height="98" rx="12" fill="#f8fafb" stroke="#e6ecf0" stroke-width="1"/><rect x="525.0" y="182.0" width="3" height="13" rx="1.5" fill="#0f766e"/><text x="537.0" y="193.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#0b1116">Infrastructure</text><text x="982.0" y="192.0" font-family="Consolas, SF Mono, Menlo, monospace" font-size="10.5" letter-spacing="1" fill="#6b7885" text-anchor="end">04</text><text x="525.0" y="219.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.6" fill="#3d4a55">Servers, DNS, hosting, backups, monitoring, networks and biometric</text><text x="525.0" y="238.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.6" fill="#3d4a55">attendance. The layer that keeps it usable.</text></svg>