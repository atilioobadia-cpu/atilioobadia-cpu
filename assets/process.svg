<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="262" viewBox="0 0 1000 262" role="img" aria-label="How Atilio Obadia works"><title>How Atilio Obadia works</title><text x="0.0" y="16.0" font-family="Consolas, SF Mono, Menlo, monospace" font-size="11.5" letter-spacing="1.2" fill="#0f766e">06</text><text x="34.4" y="16.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="600" letter-spacing="2.2" fill="#0b1116">how i work</text><text x="956.8" y="16.0" font-family="Consolas, SF Mono, Menlo, monospace" font-size="10.5" letter-spacing="1.2" fill="#616e7b">method</text><line x1="145.4" y1="12" x2="934.8" y2="12" stroke="#e2e7ec" stroke-width="1"/><text x="0.0" y="72.0" font-family="Consolas, SF Mono, Menlo, monospace" font-size="11" letter-spacing="1.2" fill="#0f766e">01</text><text x="40.0" y="72.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="600" fill="#0b1116">Written scope</text><text x="330.0" y="72.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.6" fill="#3d4a55">The problem, the constraint and the definition of done, in one page.</text><line x1="0" y1="96" x2="1000" y2="96" stroke="#e2e7ec" stroke-width="1"/><text x="0.0" y="122.0" font-family="Consolas, SF Mono, Menlo, monospace" font-size="11" letter-spacing="1.2" fill="#0f766e">02</text><text x="40.0" y="122.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="600" fill="#0b1116">Data model first</text><text x="330.0" y="122.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.6" fill="#3d4a55">Schemas, ledgers and permissions settled before a screen is drawn.</text><line x1="0" y1="146" x2="1000" y2="146" stroke="#e2e7ec" stroke-width="1"/><text x="0.0" y="172.0" font-family="Consolas, SF Mono, Menlo, monospace" font-size="11" letter-spacing="1.2" fill="#0f766e">03</text><text x="40.0" y="172.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="600" fill="#0b1116">Small, reviewable changes</text><text x="330.0" y="172.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.6" fill="#3d4a55">One logical change per pull request, with tests where it counts.</text><line x1="0" y1="196" x2="1000" y2="196" stroke="#e2e7ec" stroke-width="1"/><text x="0.0" y="222.0" font-family="Consolas, SF Mono, Menlo, monospace" font-size="11" letter-spacing="1.2" fill="#0f766e">04</text><text x="40.0" y="222.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="600" fill="#0b1116">Run and document</text><text x="330.0" y="222.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.6" fill="#3d4a55">Deployment, backups, monitoring and docs ship with the system.</text></svg>