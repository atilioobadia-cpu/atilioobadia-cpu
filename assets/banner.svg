<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="Atilio Obadia, open source systems developer, East Africa Community, Tanzania">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a111c"/>
      <stop offset="0.55" stop-color="#0e1a28"/>
      <stop offset="1" stop-color="#122537"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.1" fill="#ffffff" opacity="0.055"/>
    </pattern>
  </defs>

  <rect width="1280" height="340" fill="url(#bg)"/>
  <rect width="1280" height="340" fill="url(#dots)"/>
  <circle cx="1130" cy="110" r="250" fill="#2dd4bf" opacity="0.06"/>
  <circle cx="1130" cy="110" r="250" fill="none" stroke="#2dd4bf" stroke-width="1" opacity="0.10"/>

  <text x="72" y="70" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="4.2" fill="#5c7a94">ERPCODEC</text>
  <line x1="72" y1="84" x2="180" y2="84" stroke="#2dd4bf" stroke-width="1" opacity="0.35"/>

  <rect x="72" y="112" width="6" height="96" rx="3" fill="url(#accent)"/>

  <text x="102" y="160" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="60" font-weight="700" letter-spacing="0.5" fill="#f2f7fb">Atilio Obadia</text>
  <text x="104" y="212" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="500" fill="#2dd4bf">Open source systems developer</text>
  <text x="104" y="246" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" fill="#93a7bd">ERPNext &#183; Frappe &#183; TypeScript &#183; AI agents</text>

  <text x="104" y="300" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" letter-spacing="3.4" fill="#6b8299">EAST AFRICA COMMUNITY &#183; TANZANIA</text>

  <circle cx="1112" cy="168" r="78" fill="#0b1420" opacity="0.55"/>
  <circle cx="1112" cy="168" r="78" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.55"/>
  <text x="1112" y="191" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="56" font-weight="600" letter-spacing="6" fill="#e8f7f4">AO</text>
</svg>
