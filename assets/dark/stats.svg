<svg viewBox="0 0 1000 310" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GitHub statistics and repository languages">
  <style>
.mono{font-family:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
.draw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 1.5s cubic-bezier(.6,0,.2,1) .1s forwards}
.fade{opacity:0;animation:fade .7s ease .1s forwards}
.rise{opacity:0;animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}
.grow{transform:scaleX(0);animation:grow 1s cubic-bezier(.2,.7,.2,1) forwards}
.pulse{animation:pulse 2.6s ease-in-out infinite}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes grow{to{transform:scaleX(1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.a1{animation-delay:.15s}.a2{animation-delay:.3s}.a3{animation-delay:.45s}.a4{animation-delay:.6s}
.a5{animation-delay:.75s}.a6{animation-delay:.9s}.a7{animation-delay:1.05s}.a8{animation-delay:1.2s}
@media (prefers-reduced-motion:reduce){
  .draw{stroke-dashoffset:0;animation:none}
  .fade,.rise{opacity:1;animation:none}
  .grow{transform:none;animation:none}
  .pulse{animation:none}
}
</style>
  <g class="mono">
  <rect x="24" y="20" width="456" height="270" fill="#171f27" stroke="#26313a" rx="2"/>
  <rect x="520" y="20" width="456" height="270" fill="#171f27" stroke="#26313a" rx="2"/>
  <text x="52" y="58" font-size="15" fill="#e8eff4" letter-spacing="2" font-weight="700">GITHUB — AT A GLANCE</text>
  <line x1="52" y1="72" x2="452" y2="72" stroke="#26313a" stroke-width="1"/>
  <text x="52" y="110" font-size="11" fill="#a3b0bb" letter-spacing="1">PUBLIC REPOSITORIES</text>
  <text x="436" y="110" font-size="13" fill="#e8eff4" text-anchor="end">50</text>
  <text x="52" y="146" font-size="11" fill="#a3b0bb" letter-spacing="1">STARS ACROSS REPOS</text>
  <text x="436" y="146" font-size="13" fill="#e8eff4" text-anchor="end">9</text>
  <text x="52" y="182" font-size="11" fill="#a3b0bb" letter-spacing="1">FOLLOWERS</text>
  <text x="436" y="182" font-size="13" fill="#e8eff4" text-anchor="end">15</text>
  <text x="52" y="218" font-size="11" fill="#a3b0bb" letter-spacing="1">FORKED REPOS</text>
  <text x="436" y="218" font-size="13" fill="#e8eff4" text-anchor="end">18</text>
  <text x="52" y="254" font-size="11" fill="#a3b0bb" letter-spacing="1">MEMBER SINCE</text>
  <text x="436" y="254" font-size="13" fill="#e8eff4" text-anchor="end">2025</text>
  <text x="548" y="58" font-size="15" fill="#e8eff4" letter-spacing="2" font-weight="700">LANGUAGES BY REPOSITORY</text>
  <line x1="548" y1="72" x2="948" y2="72" stroke="#26313a" stroke-width="1"/>
  <text x="548" y="105" font-size="10" fill="#a3b0bb">PYTHON</text>
  <rect x="660" y="96" width="270" height="12" fill="#1a232b" stroke="#26313a"/>
  <rect x="660" y="96" width="270" height="12" fill="#2dd4bf" class="grow a1" style="transform-origin:660px 0"/>
  <text x="548" y="141" font-size="10" fill="#a3b0bb">TYPESCRIPT</text>
  <rect x="660" y="132" width="270" height="12" fill="#1a232b" stroke="#26313a"/>
  <rect x="660" y="132" width="123" height="12" fill="#e8eff4" class="grow a2" style="transform-origin:660px 0"/>
  <text x="548" y="177" font-size="10" fill="#a3b0bb">HTML</text>
  <rect x="660" y="168" width="270" height="12" fill="#1a232b" stroke="#26313a"/>
  <rect x="660" y="168" width="123" height="12" fill="#e8eff4" class="grow a3" style="transform-origin:660px 0"/>
  <text x="548" y="213" font-size="10" fill="#a3b0bb">CSS</text>
  <rect x="660" y="204" width="270" height="12" fill="#1a232b" stroke="#26313a"/>
  <rect x="660" y="204" width="74" height="12" fill="#e8eff4" class="grow a4" style="transform-origin:660px 0"/>
  <text x="548" y="249" font-size="10" fill="#a3b0bb">PHP</text>
  <rect x="660" y="240" width="270" height="12" fill="#1a232b" stroke="#26313a"/>
  <rect x="660" y="240" width="49" height="12" fill="#e8eff4" class="grow a5" style="transform-origin:660px 0"/>
  <text x="548" y="285" font-size="10" fill="#a3b0bb">OTHER</text>
  <rect x="660" y="276" width="270" height="12" fill="#1a232b" stroke="#26313a"/>
  <rect x="660" y="276" width="49" height="12" fill="#e8eff4" class="grow a6" style="transform-origin:660px 0"/>
  </g>
</svg>
