<svg viewBox="0 0 1000 236" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="About Atilio Obadia — ERPNext, Frappe, Tanzania">
  <style>
.mono{font-family:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
.draw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 1.5s cubic-bezier(.6,0,.2,1) .1s forwards}
.fade{opacity:0;animation:fade .7s ease .1s forwards}
.rise{opacity:0;animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}
.grow{transform:scaleX(0);animation:grow 1s cubic-bezier(.2,.7,.2,1) forwards}
.pulse{animation:pulse 2.6s ease-in-out infinite}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes grow{to{transform:scaleX(1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.a1{animation-delay:.15s}.a2{animation-delay:.3s}.a3{animation-delay:.45s}.a4{animation-delay:.6s}
.a5{animation-delay:.75s}.a6{animation-delay:.9s}.a7{animation-delay:1.05s}.a8{animation-delay:1.2s}
@media (prefers-reduced-motion:reduce){
  .draw{stroke-dashoffset:0;animation:none}
  .fade,.rise{opacity:1;animation:none}
  .grow{transform:none;animation:none}
  .pulse{animation:none}
}
</style>
  <g class="mono">
  <text x="48" y="32" font-size="15" fill="#e8eff4" class="rise a1">Systems developer in Tanzania — ERPNext, Frappe and the systems around them.</text>
  <text x="48" y="60" font-size="15" fill="#e8eff4" class="rise a2">Implementation, localisation, integrations, and the infrastructure that keeps them running.</text>
  <text x="48" y="88" font-size="15" fill="#a3b0bb" class="rise a3">Started in IT support and networks. Ended up in ERP, where every system answers for its ledger.</text>
  <line x1="48" y1="116" x2="952" y2="116" stroke="#26313a" stroke-width="1" opacity="0.7" class="rise a4"/>
  <text x="48" y="148" font-size="11" fill="#a3b0bb" letter-spacing="2.5" class="rise a4">FOCUS</text>
  <text x="154" y="148" font-size="15" fill="#e8eff4" class="rise a4">ERPNext &amp; Frappe · localisation · integrations · infrastructure</text>
  <text x="48" y="182" font-size="11" fill="#a3b0bb" letter-spacing="2.5" class="rise a5">STATUS</text>
  <text x="154" y="182" font-size="15" fill="#2dd4bf" class="rise a5">accepting projects · open to collaboration</text>
  <text x="48" y="216" font-size="11" fill="#a3b0bb" letter-spacing="2.5" class="rise a6">BRAND</text>
  <text x="154" y="216" font-size="15" fill="#e8eff4" class="rise a6">ERPcodec — systems development under Savari Limited</text>
  </g>
</svg>
