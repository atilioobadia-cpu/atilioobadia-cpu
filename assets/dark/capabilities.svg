<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="292" viewBox="0 0 1000 292" role="img" aria-label="What Atilio Obadia does"><title>What Atilio Obadia does</title><text x="0.0" y="16.0" font-family="Consolas, SF Mono, Menlo, monospace" font-size="11.5" letter-spacing="1.2" fill="#2dd4bf">02</text><text x="34.4" y="16.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="600" letter-spacing="2.2" fill="#eef3f6">what i do</text><text x="942.4" y="16.0" font-family="Consolas, SF Mono, Menlo, monospace" font-size="10.5" letter-spacing="1.2" fill="#7d8b97">services</text><line x1="133.2" y1="12" x2="920.4" y2="12" stroke="#232d36" stroke-width="1"/><rect x="0.0" y="52.0" width="493.0" height="102" rx="12" fill="#0f151c" stroke="#1e2a35" stroke-width="1"/><rect x="18.0" y="70.0" width="3" height="13" rx="1.5" fill="#2dd4bf"/><text x="30.0" y="81.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#eef3f6">ERP implementation</text><text x="475.0" y="80.0" font-family="Consolas, SF Mono, Menlo, monospace" font-size="10.5" letter-spacing="1" fill="#7d8b97" text-anchor="end">01</text><text x="18.0" y="108.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#b6c2cc">Full-cycle ERPNext and Frappe rollouts: chart of accounts, workflows,</text><text x="18.0" y="128.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#b6c2cc">custom DocTypes, server and client scripts.</text><rect x="507.0" y="52.0" width="493.0" height="102" rx="12" fill="#0f151c" stroke="#1e2a35" stroke-width="1"/><rect x="525.0" y="70.0" width="3" height="13" rx="1.5" fill="#2dd4bf"/><text x="537.0" y="81.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#eef3f6">Custom systems</text><text x="982.0" y="80.0" font-family="Consolas, SF Mono, Menlo, monospace" font-size="10.5" letter-spacing="1" fill="#7d8b97" text-anchor="end">02</text><text x="525.0" y="108.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#b6c2cc">Purpose-built platforms when off-the-shelf stops fitting: inventory,</text><text x="525.0" y="128.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#b6c2cc">portals, booking and operations dashboards.</text><rect x="0.0" y="168.0" width="493.0" height="102" rx="12" fill="#0f151c" stroke="#1e2a35" stroke-width="1"/><rect x="18.0" y="186.0" width="3" height="13" rx="1.5" fill="#2dd4bf"/><text x="30.0" y="197.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#eef3f6">Systems integration</text><text x="475.0" y="196.0" font-family="Consolas, SF Mono, Menlo, monospace" font-size="10.5" letter-spacing="1" fill="#7d8b97" text-anchor="end">03</text><text x="18.0" y="224.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#b6c2cc">REST APIs, payment and messaging gateways, and AI and MCP tooling</text><text x="18.0" y="244.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#b6c2cc">that sits inside ERP workflows.</text><rect x="507.0" y="168.0" width="493.0" height="102" rx="12" fill="#0f151c" stroke="#1e2a35" stroke-width="1"/><rect x="525.0" y="186.0" width="3" height="13" rx="1.5" fill="#2dd4bf"/><text x="537.0" y="197.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#eef3f6">Infrastructure</text><text x="982.0" y="196.0" font-family="Consolas, SF Mono, Menlo, monospace" font-size="10.5" letter-spacing="1" fill="#7d8b97" text-anchor="end">04</text><text x="525.0" y="224.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#b6c2cc">Servers, DNS, hosting, backups, monitoring, networks and biometric</text><text x="525.0" y="244.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#b6c2cc">attendance. The layer that keeps it usable.</text></svg>