<svg width="1000" height="250" viewBox="0 0 1000 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1000" y2="250"><stop offset="0%" stop-color="#020617"/><stop offset="100%" stop-color="#12112c"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#22d3ee"/><stop offset="55%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#ec4899"/><animateTransform attributeName="gradientTransform" type="translate" values="-200 0;200 0;-200 0" dur="5s" repeatCount="indefinite"/></linearGradient>
    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>.meta{font:800 13px 'Segoe UI',Arial,sans-serif;letter-spacing:4px;fill:#67e8f9}.title{font:900 48px 'Segoe UI',Arial,sans-serif;fill:#f8fafc}.desc{font:600 18px 'Segoe UI',Arial,sans-serif;fill:#94a3b8}.tag{font:800 12px 'Segoe UI',Arial,sans-serif;letter-spacing:2px;fill:#dbeafe}</style>
  </defs>
  <rect width="1000" height="250" rx="24" fill="url(#bg)"/>
  <rect x="6" y="6" width="988" height="238" rx="20" fill="none" stroke="url(#edge)" stroke-width="2" stroke-opacity="0.7" stroke-dasharray="460 110" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-570" dur="16s" repeatCount="indefinite"/></rect>
  <g transform="translate(100 75)" filter="url(#glow)">
    <rect x="0" y="10" width="82" height="52" rx="7" fill="none" stroke="#22d3ee" stroke-width="3"/>
    <rect x="5" y="15" width="72" height="42" rx="4" fill="#0b1220"/>
    <line x1="24" y1="72" x2="58" y2="72" stroke="#22d3ee" stroke-width="3"/>
    <line x1="41" y1="72" x2="41" y2="84" stroke="#22d3ee" stroke-width="3"/>
    <circle cx="32" cy="34" r="6" fill="#8b5cf6"><animate attributeName="r" values="4;8;4" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="50" cy="34" r="6" fill="#22d3ee"/>
    <circle cx="41" cy="50" r="6" fill="#ec4899"/>
  </g>
  <text x="340" y="76" class="meta">WHITE-LABEL DESK</text>
  <text x="340" y="130" class="title">AIMS DESK</text>
  <text x="340" y="166" class="desc">The fully branded ERPNext v16 experience at Alpha Associates Tanzania Limited.</text>
  <g transform="translate(340 200)"><rect width="120" height="26" rx="13" fill="#0f172a" stroke="#22d3ee" stroke-opacity=".45"/><text x="60" y="18" text-anchor="middle" class="tag">AIMS</text></g>
  <g transform="translate(476 200)"><rect width="110" height="26" rx="13" fill="#0f172a" stroke="#8b5cf6" stroke-opacity=".45"/><text x="55" y="18" text-anchor="middle" class="tag">ERPNext</text></g>
  <g transform="translate(602 200)"><rect width="104" height="26" rx="13" fill="#0f172a" stroke="#ec4899" stroke-opacity=".45"/><text x="52" y="18" text-anchor="middle" class="tag">FRAPPE</text></g>
</svg>
